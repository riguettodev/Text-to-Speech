name: Build

# Gera os executáveis quando uma tag vX.Y.Z é enviada (publica no Release),
# ou manualmente (só anexa os artefatos no run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Text-to-Speech-windows
            artefato: dist/Text-to-Speech-windows.exe
          # ubuntu-22.04 (glibc antigo) p/ o binário rodar em distros mais velhas
          - os: ubuntu-22.04
            nome: Text-to-Speech-linux
            artefato: dist/Text-to-Speech-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # Falha cedo com mensagem clara se o tkinter não vier no Python do runner.
      - name: Verificar tkinter
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Empacotar (onefile)
        run: pyinstaller --onefile --windowed --name "${{ matrix.nome }}" --paths src app.py

      - name: Subir artefato do run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: ${{ matrix.artefato }}

      - name: Publicar no Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artefato }}
